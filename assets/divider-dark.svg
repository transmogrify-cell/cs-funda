<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 34" width="900" height="34" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">section divider</title>
  <desc id="d">Blueprint drafting rule with a travelling highlight.</desc>
  <defs>
    <pattern id="dd-gmin" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#7fd4ff" stroke-width="0.7" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="dd-gmaj" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#dd-gmin)"/>
      <path d="M100 0H0V100" fill="none" stroke="#7fd4ff" stroke-width="1.1" stroke-opacity="0.13"/>
    </pattern>
    <linearGradient id="dd-title" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#e8f5ff"/>
      <stop offset="55%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dd-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="dd-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="72%" stop-color="#5eead4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dd-vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0%" stop-color="#0d2f52" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#071a2f" stop-opacity="0"/>
    </radialGradient>

    <filter id="dd-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dd-glow-s" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="dd-gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dd-cp"><rect x="40" y="0" width="820" height="34"/></clipPath>
  </defs>
  <style>
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    .cm{opacity:0;animation:fade .7s ease-out forwards}
    .draw{stroke-dasharray:var(--d,420);stroke-dashoffset:var(--d,420);animation:draw 1.8s ease-out forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.12}}
    @keyframes sweep{0%{transform:translate(var(--s,-300px),0)}100%{transform:translate(var(--e,1300px),0)}}

    .rule{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s ease-out forwards}
    .gl{--s:-160px;--e:900px;animation:sweep 4.6s linear infinite}
  </style>
  <path class="rule" d="M40 17H860" stroke="#9ecbec" stroke-width="1.2" stroke-opacity=".5" fill="none"/>
  <path class="fade" style="animation-delay:.8s" d="M60 13v8M120 13v8M180 13v8M240 13v8M300 13v8M360 13v8M420 13v8M480 13v8M540 13v8M600 13v8M660 13v8M720 13v8M780 13v8M840 13v8" stroke="#9ecbec" stroke-width="1" stroke-opacity=".3"/>
  <g class="fade" style="animation-delay:1s">
    <path d="M450 10l7 7-7 7-7-7z" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="450" cy="17" r="1.8" fill="#fbbf24"/>
  </g>
  <g clip-path="url(#dd-cp)"><rect class="gl" x="-160" y="16" width="160" height="2" fill="url(#dd-gl)"/></g>
</svg>
