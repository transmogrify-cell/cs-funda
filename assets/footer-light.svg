      <path d="M100 0H0V100" fill="none" stroke="#0a2540" stroke-width="1.1" stroke-opacity="0.16"/>
    </pattern>
    <linearGradient id="fl-title" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="fl-bar" x1="0" y1="0" x2="1" y2="0">
