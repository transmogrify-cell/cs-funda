<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 150" width="940" height="150" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">cs-funda title block</title>
  <desc id="d">Engineering drawing title block listing project, author, scale, revision and sheet number.</desc>
  <defs>
    <pattern id="fl-gmin" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#0a2540" stroke-width="0.7" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="fl-gmaj" width="100" height="100" patternUnits="userSpaceOnUse">
