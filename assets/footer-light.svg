    <radialGradient id="fl-vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0%" stop-color="#e2edf7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5f9fd" stop-opacity="0"/>
    </radialGradient>

    <filter id="fl-glow" x="-10%" y="-10%" width="120%" height="120%">
