<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">cs-funda — computer science engineering notebook</title>
  <desc id="d">Animated blueprint banner: drafting frame, CS-FUNDA title, module list and a rotating technical rosette.</desc>
  <defs>
    <pattern id="bl-gmin" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#0a2540" stroke-width="0.7" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="bl-gmaj" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#bl-gmin)"/>
      <path d="M100 0H0V100" fill="none" stroke="#0a2540" stroke-width="1.1" stroke-opacity="0.16"/>
    </pattern>
    <linearGradient id="bl-title" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bl-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="bl-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="72%" stop-color="#0d9488" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bl-vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0%" stop-color="#e2edf7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5f9fd" stop-opacity="0"/>
    </radialGradient>

    <filter id="bl-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="0"/>
    </filter>
    <filter id="bl-glow-s" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="0"/>
    </filter>
    <linearGradient id="bl-wedge" x1="0" y1="0" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bl-clip"><rect x="0" y="0" width="1000" height="320"/></clipPath>
  </defs>
  <style>
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    .cm{opacity:0;animation:fade .7s ease-out forwards}
    .draw{stroke-dasharray:var(--d,420);stroke-dashoffset:var(--d,420);animation:draw 1.8s ease-out forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.12}}
    @keyframes sweep{0%{transform:translate(var(--s,-300px),0)}100%{transform:translate(var(--e,1300px),0)}}

    .ttl-s{fill:none;stroke:#0a2540;stroke-width:1.15;stroke-opacity:.9;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.3s ease-out forwards}
    .ttl-f{opacity:0;animation:fade 1.5s ease-out 1.25s forwards}
    .rule{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.5s ease-out .35s forwards}
    .frm{stroke-dasharray:2450;stroke-dashoffset:2450;animation:draw 2.6s ease-out forwards}
    .led{animation:blink 1.7s ease-in-out infinite}
    .swp{--s:-300px;--e:1320px;animation:sweep 7s cubic-bezier(.4,0,.2,1) 1.6s infinite}
  </style>
