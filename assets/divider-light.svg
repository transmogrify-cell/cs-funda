<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 34" width="900" height="34" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">section divider</title>
  <desc id="d">Blueprint drafting rule with a travelling highlight.</desc>
  <defs>
    <pattern id="dl-gmin" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#0a2540" stroke-width="0.7" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="dl-gmaj" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#dl-gmin)"/>
      <path d="M100 0H0V100" fill="none" stroke="#0a2540" stroke-width="1.1" stroke-opacity="0.16"/>
    </pattern>
    <linearGradient id="dl-title" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="dl-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="dl-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="72%" stop-color="#0d9488" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dl-vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0%" stop-color="#e2edf7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5f9fd" stop-opacity="0"/>
    </radialGradient>

    <filter id="dl-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="0"/>
    </filter>
    <filter id="dl-glow-s" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="0"/>
    </filter>
    <linearGradient id="dl-gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dl-cp"><rect x="40" y="0" width="820" height="34"/></clipPath>
  </defs>
  <style>
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    .cm{opacity:0;animation:fade .7s ease-out forwards}
    .draw{stroke-dasharray:var(--d,420);stroke-dashoffset:var(--d,420);animation:draw 1.8s ease-out forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.12}}
    @keyframes sweep{0%{transform:translate(var(--s,-300px),0)}100%{transform:translate(var(--e,1300px),0)}}

    .rule{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s ease-out forwards}
    .gl{--s:-160px;--e:900px;animation:sweep 4.6s linear infinite}
  </style>
  <path class="rule" d="M40 17H860" stroke="#14456e" stroke-width="1.2" stroke-opacity=".5" fill="none"/>
  <path class="fade" style="animation-delay:.8s" d="M60 13v8M120 13v8M180 13v8M240 13v8M300 13v8M360 13v8M420 13v8M480 13v8M540 13v8M600 13v8M660 13v8M720 13v8M780 13v8M840 13v8" stroke="#14456e" stroke-width="1" stroke-opacity=".3"/>
  <g class="fade" style="animation-delay:1s">
    <path d="M450 10l7 7-7 7-7-7z" fill="none" stroke="#b45309" stroke-width="1.2"/>
    <circle cx="450" cy="17" r="1.8" fill="#b45309"/>
  </g>
  <g clip-path="url(#dl-cp)"><rect class="gl" x="-160" y="16" width="160" height="2" fill="url(#dl-gl)"/></g>
</svg>
