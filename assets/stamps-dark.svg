<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 62" width="900" height="62" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">cs-funda spec stamps</title>
  <desc id="d">Blueprint specification chips: language, module count, topic count, status and licence.</desc>
  <defs>
    <pattern id="sd-gmin" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#7fd4ff" stroke-width="0.7" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="sd-gmaj" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#sd-gmin)"/>
      <path d="M100 0H0V100" fill="none" stroke="#7fd4ff" stroke-width="1.1" stroke-opacity="0.13"/>
    </pattern>
    <linearGradient id="sd-title" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#e8f5ff"/>
      <stop offset="55%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sd-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="sd-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="72%" stop-color="#5eead4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sd-vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0%" stop-color="#0d2f52" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#071a2f" stop-opacity="0"/>
    </radialGradient>

    <filter id="sd-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sd-glow-s" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    .cm{opacity:0;animation:fade .7s ease-out forwards}
    .draw{stroke-dasharray:var(--d,420);stroke-dashoffset:var(--d,420);animation:draw 1.8s ease-out forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.12}}
    @keyframes sweep{0%{transform:translate(var(--s,-300px),0)}100%{transform:translate(var(--e,1300px),0)}}

    .chip{opacity:0;animation:fade .55s ease-out forwards}
    .cdraw{stroke-dasharray:var(--d,400);stroke-dashoffset:var(--d,400);animation:draw 1s ease-out forwards}
    .led{animation:blink 1.5s ease-in-out infinite}
  </style>
  <g class="chip" style="animation-delay:0.15s">
    <rect class="cdraw" style="--d:301.6;animation-delay:0.15s" x="181.1" y="12" width="100.8" height="38" rx="2"
      fill="#0d2f52" fill-opacity="0.55" stroke="#9ecbec" stroke-width="1.1" stroke-opacity=".7"/>
    <path d="M186.1 12v5M276.9 12v5M186.1 50v-5M276.9 50v-5" stroke="#9ecbec" stroke-width="1" stroke-opacity=".45"/>
    <text x="232.45" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" letter-spacing="1.9" fill="#5f8cb0">LANG</text>
    <text x="232.05" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#5eead4">C++ · PY</text>
    
  </g>
  <g class="chip" style="animation-delay:0.28s">
    <rect class="cdraw" style="--d:259.48;animation-delay:0.28s" x="295.9" y="12" width="79.74" height="38" rx="2"
      fill="#0d2f52" fill-opacity="0.55" stroke="#9ecbec" stroke-width="1.1" stroke-opacity=".7"/>
    <path d="M300.9 12v5M370.64 12v5M300.9 50v-5M370.64 50v-5" stroke="#9ecbec" stroke-width="1" stroke-opacity=".45"/>
    <text x="336.72" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" letter-spacing="1.9" fill="#5f8cb0">MODULES</text>
    <text x="336.32" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#e8f5ff">06</text>
    
  </g>
  <g class="chip" style="animation-delay:0.41s">
    <rect class="cdraw" style="--d:245.84;animation-delay:0.41s" x="389.64" y="12" width="72.92" height="38" rx="2"
      fill="#0d2f52" fill-opacity="0.55" stroke="#9ecbec" stroke-width="1.1" stroke-opacity=".7"/>
    <path d="M394.64 12v5M457.56 12v5M394.64 50v-5M457.56 50v-5" stroke="#9ecbec" stroke-width="1" stroke-opacity=".45"/>
    <text x="427.05" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" letter-spacing="1.9" fill="#5f8cb0">TOPICS</text>
    <text x="426.65" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#e8f5ff">120+</text>
    
  </g>
  <g class="chip" style="animation-delay:0.54s">
    <rect class="cdraw" style="--d:397.2;animation-delay:0.54s" x="476.56" y="12" width="148.6" height="38" rx="2"
      fill="#0d2f52" fill-opacity="0.55" stroke="#9ecbec" stroke-width="1.1" stroke-opacity=".7"/>
    <path d="M481.56 12v5M620.16 12v5M481.56 50v-5M620.16 50v-5" stroke="#9ecbec" stroke-width="1" stroke-opacity=".45"/>
    <text x="540.81" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" letter-spacing="1.9" fill="#5f8cb0">STATUS</text>
    <text x="540.41" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#fbbf24">IN PROGRESS</text>
    <circle class="led" cx="611.16" cy="31" r="3.4" fill="#fbbf24" filter="url(#sd-glow-s)"/>
  </g>
  <g class="chip" style="animation-delay:0.67s">
    <rect class="cdraw" style="--d:259.48;animation-delay:0.67s" x="639.16" y="12" width="79.74" height="38" rx="2"
      fill="#0d2f52" fill-opacity="0.55" stroke="#9ecbec" stroke-width="1.1" stroke-opacity=".7"/>
    <path d="M644.16 12v5M713.9 12v5M644.16 50v-5M713.9 50v-5" stroke="#9ecbec" stroke-width="1" stroke-opacity=".45"/>
    <text x="679.98" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" letter-spacing="1.9" fill="#5f8cb0">LICENSE</text>
    <text x="679.58" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#38bdf8">MIT</text>
    
  </g>
</svg>
